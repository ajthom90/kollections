name: Publish

# Publishes pre-built artifacts to GitHub Packages so consumers download binaries
# instead of rebuilding (the JitPack model). Runs when you publish a GitHub Release,
# or on demand via the Actions tab ("Run workflow").
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # macOS host builds every target except linuxMips32/linuxMipsel32 (which need a Linux host).
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write   # lets the built-in GITHUB_TOKEN publish to this repo's packages
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pgpr.user="$GPR_USER" -Pgpr.token="$GPR_TOKEN" --stacktrace
