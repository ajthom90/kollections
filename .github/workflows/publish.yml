name: Publish

# Publishes to Maven Central via the Sonatype Central Portal when you publish a
# GitHub Release, or on demand from the Actions tab ("Run workflow").
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # macOS host can build every target (Apple + JVM/JS/Wasm + cross-compiled Linux/Windows/Android Native).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The release tag (e.g. v2.0.0) must match VERSION_NAME in gradle.properties so the
      # published artifact and the GitHub Release can never disagree about the version.
      - name: Check release tag matches VERSION_NAME
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match VERSION_NAME '$version' in gradle.properties" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
